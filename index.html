
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Ride - All Pakistan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5f7fb}
.header{background:#111;color:#fff;padding:14px 16px;display:flex;justify-content:space-between}
.badge{background:#00c853;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800}
.hero{background:#111;color:#fff;text-align:center;padding:26px 16px}
.hero h1{font-size:24px}.hero span{color:#00e676}
.card{margin:12px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
input,select{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:12px;margin-bottom:10px;background:#fafafa}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opt{border:1.5px solid #ddd;padding:12px;border-radius:12px;text-align:center;font-weight:700;cursor:pointer}
.opt.active{border-color:#00c853;background:#e8f5e9}
.btn{width:100%;background:#111;color:#fff;padding:14px;border-radius:14px;border:0;font-weight:800}
.btn-green{background:#00c853}
.hideBox{background:#111;color:#fff;border-radius:14px;padding:14px;text-align:center;border:2px solid #00c853;margin-bottom:12px}
</style>
</head>
